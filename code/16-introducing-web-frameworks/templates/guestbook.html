<!doctype html>
<h1>Guestbook</h1>
<p>Signed in as {{ who }}.</p>
<ul>
{% for id, who, text in messages %}<li><a href="/messages/{{ id }}">{{ id }}</a> {{ who }}: {{ text }}</li>
{% else %}<li>nothing yet</li>
{% endfor %}</ul>
<form method="post" action="/messages">
  <input name="message"><button>sign</button>
</form>
